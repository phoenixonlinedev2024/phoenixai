<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>JARVIS — OpenClaw AI</title>
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --border: #1e3a5f;
    --accent: #00d4ff;
    --accent2: #0088aa;
    --text: #e2e8f0;
    --dim: #64748b;
    --user: #1e40af;
    --jarvis: #0f2744;
    --danger: #dc2626;
    --success: #16a34a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Courier New', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo {
    font-size: 22px;
    font-weight: bold;
    color: var(--accent);
    letter-spacing: 4px;
    text-shadow: 0 0 20px var(--accent);
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .status-text { color: var(--dim); font-size: 12px; }

  .profile-select {
    margin-left: auto;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 8px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }

  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .sidebar {
    width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
  }
  .sidebar-title { color: var(--dim); font-size: 10px; letter-spacing: 2px; margin-bottom: 4px; }
  .sidebar-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
  }
  .sidebar-btn:hover { border-color: var(--accent); color: var(--accent); }

  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }
  .message {
    display: flex;
    gap: 12px;
    max-width: 85%;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  .message.user { margin-left: auto; flex-direction: row-reverse; }
  .avatar {
    width: 32px; height: 32px;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: bold; flex-shrink: 0;
  }
  .avatar.user-av { background: var(--user); color: #fff; }
  .avatar.jarvis-av { background: var(--accent2); color: var(--accent); border: 1px solid var(--accent); }
  .bubble {
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .message.user .bubble { background: var(--user); border-radius: 6px 0 6px 6px; }
  .message.jarvis .bubble { background: var(--jarvis); border: 1px solid var(--border); border-radius: 0 6px 6px 6px; }

  .typing { display: flex; gap: 4px; align-items: center; padding: 8px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

  .input-area {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    font-family: inherit;
    font-size: 14px;
    resize: none;
    border-radius: 4px;
    outline: none;
    min-height: 44px;
    max-height: 150px;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: var(--accent); }
  .send-btn {
    background: var(--accent2);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 10px 20px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .send-btn:hover { background: var(--accent); color: var(--bg); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .ws-status {
    font-size: 10px;
    color: var(--dim);
    text-align: center;
    padding: 4px;
    background: var(--surface);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div class="logo">J.A.R.V.I.S</div>
  <div class="status-dot"></div>
  <div class="status-text">OpenClaw AI — Online</div>
  <select class="profile-select" id="profileSelect" onchange="setProfile(this.value)">
    <option value="default">Default</option>
    <option value="professional">Professional</option>
    <option value="casual">Casual</option>
    <option value="terse">Terse</option>
    <option value="verbose">Verbose</option>
  </select>
</header>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-title">ACTIONS</div>
    <button class="sidebar-btn" onclick="newSession()">⬡ New Session</button>
    <button class="sidebar-btn" onclick="showStatus()">◈ Status</button>
    <button class="sidebar-btn" onclick="showTools()">◆ Tools</button>
    <button class="sidebar-btn" onclick="showMemory()">◇ Memory</button>
    <button class="sidebar-btn" onclick="exportMD()">↓ Export MD</button>
    <button class="sidebar-btn" onclick="exportPDF()">↓ Export PDF</button>

    <div class="sidebar-title" style="margin-top:12px">V4 DASHBOARDS</div>
    <button class="sidebar-btn" onclick="showMetrics()">⚡ Metrics</button>
    <button class="sidebar-btn" onclick="showSecurity()">🔑 API Keys</button>
    <button class="sidebar-btn" onclick="showACP()">⇄ ACP Bus</button>
    <button class="sidebar-btn" onclick="showSelfImprove()">↑ Self-Improve</button>
    <button class="sidebar-btn" onclick="runBenchmark()">▶ Run Benchmark</button>
    <button class="sidebar-btn" onclick="showScheduler()">⏱ NL Scheduler</button>

    <div class="sidebar-title" style="margin-top:12px">QUICK</div>
    <button class="sidebar-btn" onclick="quickSend('Search the web for the latest AI news and summarise.')">AI News</button>
    <button class="sidebar-btn" onclick="quickSend('Get system info.')">System Info</button>
    <button class="sidebar-btn" onclick="quickSend('List all my registered tools.')">List Tools</button>
    <button class="sidebar-btn" onclick="quickSend('What have you learned so far?')">Lessons</button>
  </div>

  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="message jarvis">
        <div class="avatar jarvis-av">AI</div>
        <div class="bubble">Good day. JARVIS online. All systems nominal. How may I assist you, Sir?</div>
      </div>
    </div>
    <div class="ws-status" id="wsStatus">Connecting...</div>
    <div class="input-area">
      <textarea id="input" placeholder="Speak your mind, Sir..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">SEND</button>
    </div>
  </div>
</div>

<script>
const API = window.location.origin;
let ws = null;
let currentProfile = 'default';
let sessionId = null;
let isStreaming = false;

function connect() {
  const wsUrl = API.replace('http', 'ws') + '/ws';
  ws = new WebSocket(wsUrl);
  ws.onopen = () => setWsStatus('WebSocket connected', true);
  ws.onclose = () => { setWsStatus('Disconnected — retrying...', false); setTimeout(connect, 3000); };
  ws.onerror = () => setWsStatus('WebSocket error — using REST fallback', false);
  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.type === 'token') appendToken(data.content);
    else if (data.type === 'done') finishStreaming();
  };
}

function setWsStatus(msg, ok) {
  const el = document.getElementById('wsStatus');
  el.textContent = msg;
  el.style.color = ok ? '#16a34a' : '#64748b';
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function addMessage(role, text) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.innerHTML = `
    <div class="avatar ${role === 'user' ? 'user-av' : 'jarvis-av'}">${role === 'user' ? 'YOU' : 'AI'}</div>
    <div class="bubble">${escapeHtml(text)}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div.querySelector('.bubble');
}

function addTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.id = 'typing';
  div.className = 'message jarvis';
  div.innerHTML = '<div class="avatar jarvis-av">AI</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

let _streamBubble = null;
let _streamText = '';

function startStreaming() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'message jarvis';
  div.innerHTML = '<div class="avatar jarvis-av">AI</div><div class="bubble" id="streamBubble"></div>';
  msgs.appendChild(div);
  _streamBubble = document.getElementById('streamBubble');
  _streamText = '';
  msgs.scrollTop = msgs.scrollHeight;
}

function appendToken(token) {
  if (!_streamBubble) startStreaming();
  _streamText += token;
  _streamBubble.textContent = _streamText;
  document.getElementById('messages').scrollTop = 999999;
}

function finishStreaming() {
  _streamBubble = null;
  _streamText = '';
  isStreaming = false;
  document.getElementById('sendBtn').disabled = false;
}

async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || isStreaming) return;
  input.value = '';
  input.style.height = 'auto';

  addMessage('user', text);
  document.getElementById('sendBtn').disabled = true;
  isStreaming = true;

  if (ws && ws.readyState === WebSocket.OPEN) {
    startStreaming();
    ws.send(JSON.stringify({ message: text, profile: currentProfile }));
  } else {
    // REST fallback
    addTyping();
    try {
      const resp = await fetch(API + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, profile: currentProfile }),
      });
      const data = await resp.json();
      removeTyping();
      sessionId = data.session_id;
      addMessage('jarvis', data.response);
    } catch (e) {
      removeTyping();
      addMessage('jarvis', 'Network error: ' + e.message);
    }
    isStreaming = false;
    document.getElementById('sendBtn').disabled = false;
  }
}

function quickSend(msg) {
  document.getElementById('input').value = msg;
  sendMessage();
}

async function newSession() {
  await fetch(API + '/session/new', { method: 'POST' });
  document.getElementById('messages').innerHTML = '';
  addMessage('jarvis', 'New session started, Sir. Memory cleared for this conversation.');
}

async function showStatus() {
  const resp = await fetch(API + '/status');
  const data = await resp.json();
  addMessage('jarvis', data.status);
}

async function showTools() {
  const resp = await fetch(API + '/tools');
  const data = await resp.json();
  const lines = data.tools.map(t => `[${t.category}] ${t.name}${t.dynamic ? ' (dynamic)' : ''}: ${t.description}`);
  addMessage('jarvis', lines.join('\n'));
}

async function showMemory() {
  const [f, l] = await Promise.all([
    fetch(API + '/memory/facts').then(r => r.json()),
    fetch(API + '/memory/lessons').then(r => r.json()),
  ]);
  const facts = f.facts.map(x => `${x.key}: ${x.value}`).join('\n') || 'No facts.';
  const lessons = l.lessons.join('\n') || 'No lessons.';
  addMessage('jarvis', `FACTS:\n${facts}\n\nLESSONS:\n${lessons}`);
}

async function exportMD() {
  const resp = await fetch(API + '/export/markdown', { method: 'POST' });
  const data = await resp.json();
  addMessage('jarvis', data.message || data.error);
}

async function exportPDF() {
  const resp = await fetch(API + '/export/pdf', { method: 'POST' });
  const data = await resp.json();
  addMessage('jarvis', data.message || data.error);
}

async function setProfile(profile) {
  currentProfile = profile;
  await fetch(API + '/profile', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ profile }),
  });
  addMessage('jarvis', `Personality profile switched to: ${profile}, Sir.`);
}

function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── V4 Dashboard handlers ────────────────────────────────────────────────────

async function showMetrics() {
  addTyping();
  try {
    const resp = await fetch(API + '/metrics/json');
    const d = await resp.json();
    removeTyping();
    const up = d.uptime_seconds != null ? `Uptime: ${d.uptime_seconds.toFixed(1)}s\n` : '';
    const ctrs = Object.entries(d.counters || {}).map(([k,v]) => `  ${k}: ${v}`).join('\n') || '  (none)';
    const hists = Object.entries(d.histograms || {}).map(([k,h]) =>
      `  ${k}: count=${h.count} avg=${(h.avg||0).toFixed(3)}s p95=${(h.p95||0).toFixed(3)}s`
    ).join('\n') || '  (none)';
    addMessage('jarvis', `${up}COUNTERS:\n${ctrs}\n\nHISTOGRAMS:\n${hists}`);
  } catch(e) { removeTyping(); addMessage('jarvis', 'Metrics unavailable: ' + e.message); }
}

async function showSecurity() {
  addTyping();
  try {
    const resp = await fetch(API + '/security/keys');
    const d = await resp.json();
    removeTyping();
    if (!d.keys || !d.keys.length) { addMessage('jarvis', 'No API keys found.'); return; }
    const lines = d.keys.map(k =>
      `  [${k.role}] ${k.name || '(unnamed)'} — ${k.key_prefix} (calls: ${k.calls || 0}, created: ${k.created_at || 'unknown'})`
    );
    addMessage('jarvis', `API KEYS (${d.keys.length}):\n${lines.join('\n')}`);
  } catch(e) { removeTyping(); addMessage('jarvis', 'Security endpoint unavailable: ' + e.message); }
}

async function createApiKey(name, role) {
  role = role || 'user';
  const resp = await fetch(API + '/security/keys', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, role }),
  });
  const d = await resp.json();
  addMessage('jarvis', d.key
    ? `API key created.\nName: ${d.name}\nRole: ${d.role}\nKey: ${d.key}\n(Store this — it won't be shown again.)`
    : ('Error: ' + JSON.stringify(d)));
}

async function showACP() {
  addTyping();
  try {
    const [hResp, sResp] = await Promise.all([
      fetch(API + '/acp/history').then(r => r.json()),
      fetch(API + '/acp/stats').then(r => r.json()),
    ]);
    removeTyping();
    const statsLine = `Topics: ${sResp.topics || 0}  History size: ${sResp.history_size || 0}  Subscribers: ${JSON.stringify(sResp.subscribers || {})}`;
    const msgs = hResp.messages || [];
    const history = msgs.slice(-10).map(m =>
      `  [${m.topic}] ${m.sender || 'system'}: ${typeof m.payload === 'string' ? m.payload : JSON.stringify(m.payload)}`
    ).join('\n') || '  (empty)';
    addMessage('jarvis', `ACP BUS STATS:\n  ${statsLine}\n\nRECENT MESSAGES (last 10):\n${history}`);
  } catch(e) { removeTyping(); addMessage('jarvis', 'ACP Bus unavailable: ' + e.message); }
}

async function showSelfImprove() {
  addTyping();
  try {
    const [bResp, cResp] = await Promise.all([
      fetch(API + '/self-improve/benchmarks').then(r => r.json()),
      fetch(API + '/self-improve/capabilities').then(r => r.json()),
    ]);
    removeTyping();
    const history = bResp.history || [];
    const latest = history.length ? history[history.length - 1] : null;
    const score = latest ? `Latest pass rate: ${(latest.pass_rate * 100).toFixed(1)}% (${latest.passed}/${latest.total} at ${latest.timestamp})` : 'No benchmark runs yet.';
    const trend = bResp.trend || {};
    const trendLine = trend.runs > 1 ? `Trend over ${trend.runs} runs: ${trend.improving ? '↑' : '↓'} ${(trend.delta * 100).toFixed(1)}%` : '';
    const capLine = `Total tools: ${cResp.total_tools || 0}  Dynamic: ${cResp.dynamic_tools || 0}  Open gaps: ${cResp.open_gaps || 0}`;
    const gaps = (cResp.gap_descriptions || []).map(g => `  - ${g}`).join('\n') || '  (none)';
    addMessage('jarvis', `SELF-IMPROVE:\n  ${score}\n  ${trendLine}\n\nCAPABILITIES:\n  ${capLine}\n\nOPEN GAPS:\n${gaps}`);
  } catch(e) { removeTyping(); addMessage('jarvis', 'Self-improve endpoint unavailable: ' + e.message); }
}

async function runBenchmark() {
  addMessage('jarvis', 'Running benchmark suite — this may take a minute...');
  addTyping();
  try {
    const resp = await fetch(API + '/self-improve/run', { method: 'POST' });
    const d = await resp.json();
    removeTyping();
    const b = d.benchmark || {};
    const results = b.results || [];
    if (!results.length) { addMessage('jarvis', 'No benchmark results returned.'); return; }
    const rows = results.map(r =>
      `  ${(r.id || r.name || '?').padEnd(20)} score=${((r.score||0)*100).toFixed(1)}%  ${(r.latency||0).toFixed(2)}s  ${r.passed ? '✓' : '✗'}`
    );
    const filled = (d.gaps_filled || []).length ? `\nGaps filled: ${d.gaps_filled.join(', ')}` : '';
    addMessage('jarvis',
      `BENCHMARK RESULTS:\n${rows.join('\n')}\n\n` +
      `Pass rate: ${((b.pass_rate||0)*100).toFixed(1)}% (${b.passed}/${b.total})\n` +
      `Avg score: ${((b.avg_score||0)*100).toFixed(1)}%  Avg latency: ${(b.avg_latency_s||0).toFixed(2)}s${filled}`
    );
  } catch(e) { removeTyping(); addMessage('jarvis', 'Benchmark failed: ' + e.message); }
}

async function showScheduler() {
  addTyping();
  try {
    const resp = await fetch(API + '/schedule');
    const d = await resp.json();
    removeTyping();
    const tasks = (d.tasks || []).map(t =>
      `  [${t.id || '?'}] ${t.name} — cron: ${t.cron}  prompt: ${(t.prompt || '').slice(0, 60)}${(t.prompt || '').length > 60 ? '...' : ''}`
    ).join('\n') || '  (no scheduled tasks)';
    addMessage('jarvis', `SCHEDULED TASKS:\n${tasks}\n\nTip: use scheduleNL(phrase, name, prompt) in the console, or POST to /schedule/nl`);
  } catch(e) { removeTyping(); addMessage('jarvis', 'Scheduler unavailable: ' + e.message); }
}

async function scheduleNL(phrase, name, prompt) {
  name = name || 'manual_' + Date.now();
  prompt = prompt || phrase;
  const resp = await fetch(API + '/schedule/nl', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, schedule: phrase, prompt }),
  });
  const d = await resp.json();
  addMessage('jarvis', d.cron
    ? `Scheduled "${name}": "${phrase}" → cron: ${d.cron}`
    : ('Error: ' + JSON.stringify(d)));
}

connect();
</script>
</body>
</html>
